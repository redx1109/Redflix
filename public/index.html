<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.png" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <title>Redflix</title>
  <meta property="og:title" content="Redflix">
  <meta property="og:description" content="Watch free movies & TV shows, no subscription needed!">
  <meta property="og:image" content="favicon.png">
  <meta property="og:url" content="https://reddflix.vercel.app">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Playfair+Display:wght@400;500&family=Space+Grotesk:wght@400;500&family=Rajdhani:wght@400;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <nav>
    <div class="logo">Redflix</div>
    <div class="nav-links">
      <a class="active" onclick="switchToHome()">Home</a>
      <a onclick="switchType('movie')">Movies</a>
      <a onclick="switchType('tv')">TV Shows</a>
      <a onclick="switchType('anime')">Anime</a>
      <a onclick="showMyList()">My List</a>
    </div>
    <div class="search-bar">
      <i class="ti ti-search" style="font-size:15px;color:rgba(255,255,255,0.3)" aria-hidden="true"></i>
      <input type="text" placeholder="Search movies, shows..." oninput="handleSearch(this.value)">
    </div>
  </nav>

  <div class="hero">
    <div class="hero-content">
      <div class="hero-badge"><i class="ti ti-trending-up" style="font-size:13px" aria-hidden="true"></i> Trending now</div>
      <h1>Watch <span>Free</span> Movies &amp; TV Shows</h1>
      <p>Thousands of titles, no subscription needed. Just hit play and enjoy.</p>
      <div class="hero-btns">
        <button class="btn-primary">
          <i class="ti ti-player-play" aria-hidden="true"></i> Watch now
        </button>
        <button class="btn-secondary">Browse all</button>
      </div>
    </div>
  </div>

  <div class="genre-tabs" id="genreTabs"></div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Trending this week</span>
      <span class="see-all" onclick="loadMore()">See all</span>
    </div>
    <div class="trending-row" id="trendingRow"></div>
  </div>

  <div class="section"  id="popularSection">
    <div class="section-header">
      <span class="section-title" id="gridTitle">Popular movies</span>
      <span class="see-all">See all</span>
    </div>
    <div class="movies-grid" id="moviesGrid"></div>
  </div>
</div>
<div class="detail-modal" id="detailModal">
  <div class="detail-box">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-overlay"></div>
    <button class="close-btn detail-close" onclick="closeDetail()">
      <i class="ti ti-x"></i>
    </button>
    <div class="detail-content">
      <div class="detail-poster" id="detailPoster"></div>
      <div class="detail-info">
        <h2 id="detailTitle"></h2>
        <div class="detail-meta">
          <span id="detailYear"></span>
          <span id="detailRuntime"></span>
          <span id="detailRating"></span>
        </div>
        <div class="detail-genres" id="detailGenres"></div>
        <p class="detail-overview" id="detailOverview"></p>
        <div class="detail-cast" id="detailCast"></div>
        <div class="detail-btns">
          <button class="btn-primary" id="detailPlayBtn">
            <i class="ti ti-player-play"></i> Play Now
          </button>
          <button class="btn-secondary" onclick="closeDetail()">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="player-modal" id="playerModal">
  <div class="player-box">
    <div class="player-header">
      <span class="player-title" id="playerTitle">Movie Title</span>
      <button class="close-btn" onclick="closePlayer()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div class="player-frame">
      <div class="player-placeholder">
        <iframe id="playerIframe" src="" allowfullscreen
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
        style="width:100%;height:100%;border:none;"></iframe>
      </div>
    </div>
    <div id="episodeControls" style="display:none;width:100%;padding:10px 18px;border-top:0.5px solid rgba(255,255,255,0.08);">
      <input id="seasonInput" type="hidden" value="1">
      <input id="episodeInput" type="hidden" value="1">
      <div id="seasonTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"></div>
      <div id="episodeList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:200px;overflow-y:auto;"></div>
    </div>
    <div class="embed-note" style="display:flex;gap:16px;align-items:center;justify-content:center;padding:12px 18px;"><span id="adWarning" style="color:#ff4444;font-size:12px"></span>
    <select id="srcSelect" onchange="loadEmbed()" style="background:#1a1a1a;color:#fff;border:0.5px solid rgba(255,255,255,0.15);border-radius:6px;padding:4px 8px;font-size:12px">
      <option value="zxcstream">ZXCStream ⭐</option>
      <option value="cinesrc">CineSrc ⭐</option>
      <option value="autoembed">AutoEmbed ⭐</option>
      <option value="apiplayer">ApiPlayer ⭐</option>
      <option value="filmu">FilmU ⭐</option>
      <option value="peachify">Peachify 🍑</option>
      <option value="videasy">VidEasy</option> 
      <option value="embedmaster">EmbedMaster</option>
      <option value="vidlink">VidLink</option>
      <option value="twoembed">2Embed ✅</option>
      <option value="twoembedskin">2Embed Skin</option> 
      <option value="vidfast">VidFast ⚡</option>
      <option value="vidzee">VidZee 4K ✅</option>
      <option value="vidnest">Vidnest</option>
      <option value="mapplee">Mapple</option>
      <option value="primesrc">PrimeSrc</option>
    </select>
  <input id="tmdbInput" type="number" style="display:none">
  <button id="nextEpBtn" onclick="nextEpisode()" style="display:none;background:rgba(255,255,255,0.08);color:#fff;border:0.5px solid rgba(255,255,255,0.15);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer">Next EP ▶</button>
</div>
  </div>
</div>
<div id="continuePopup" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;">
  <div style="background:#0d0d1c;border:0.5px solid rgba(229,9,20,0.3);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center;width:min(90vw,500px);box-shadow:0 8px 40px rgba(0,0,0,0.9);position:relative;">
    <img id="continuePopupPoster" src="" style="width:100px;height:150px;border-radius:8px;object-fit:cover;flex-shrink:0;border:0.5px solid rgba(255,255,255,0.1)">
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:4px">Continue watching</div>
      <div id="continuePopupTitle" style="font-size:20px;color:#fff;font-weight:500;margin-bottom:4px"></div>
      <div id="continuePopupSub" style="font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:18px"></div>
      <button onclick="resumeWatching()" style="background:linear-gradient(135deg,#ff2234,#e50914);border:none;color:#fff;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;font-weight:500">▶ Resume</button>
    </div>
    <button onclick="dismissPopup()" style="position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.08);border:none;color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">✕</button>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/render.js"></script>
<script src="js/api.js"></script>
<script src="js/player.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="themes/theme-switcher.js"></script>
</body>
</html>
